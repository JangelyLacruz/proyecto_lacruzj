name: despliegue y pruebas

# Se dispara en cada push o Pull Request hacia la rama de deploy
on:
  push:
    branches: [deploy]
  pull_request:
    branches: [deploy]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Pruebas_codeception:
    runs-on: ubuntu-latest
        
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "root_password"
          MYSQL_DATABASE: proyecto_lacruz
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Preparar ruta de la aplicación para CI
        run: |
          mkdir -p /tmp/www
          ln -s "$GITHUB_WORKSPACE" /tmp/www/proyecto-lacruz-j

      - name: Preparar bases de datos para pruebas
        env:
          MYSQL_PWD: root_password
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS proyecto_lacruz"
          mysql -h 127.0.0.1 -u root proyecto_lacruz < src/config/connect/proyecto_lacruz.sql
          mysql -h 127.0.0.1 -u root < src/config/connect/proyecto_lacruz_seguridad.sql
          mysql -h 127.0.0.1 -u root -e "SHOW DATABASES;"
          mysql -h 127.0.0.1 -u root -N -e "SHOW TABLES FROM proyecto_lacruz_seguridad LIKE 'accesos';"
          mysql -h 127.0.0.1 -u root -e "SELECT COUNT(*) FROM proyecto_lacruz_seguridad.accesos;"

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, json, pdo, pdo_mysql
          tools: composer

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Dar permisos de ejecucion a codeception
        run: chmod +x vendor/bin/codecept

      - name: Iniciar chromedriver
        uses: nanasess/setup-chromedriver@v3

      - name: Ejecutar pruebas
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: proyecto_lacruz
          DB_USER: root
          DB_PASS: root_password

        run: |
          chromedriver --port=9515 > /tmp/chromedriver.log 2>&1 &
          CHROMEDRIVER_PID=$!

          php -S 127.0.0.1:8000 -t /tmp/www > /tmp/php-server.log 2>&1 &
          
          PHP_SERVER_PID=$!
          trap 'kill "$CHROMEDRIVER_PID" "$PHP_SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:9515/status \
              | jq --exit-status '.value.ready == true' >/dev/null; then
              echo "ChromeDriver esta listo."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "ChromeDriver no estuvo listo en 30 segundos." >&2
              cat /tmp/chromedriver.log
              exit 1
            fi
            echo "Esperando a ChromeDriver (${attempt}/30)..."
            sleep 1
          done

          for attempt in {1..30}; do
            if curl --silent --output /dev/null --fail http://127.0.0.1:8000/proyecto-lacruz-j/; then
              echo "Servidor PHP esta listo."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "El servidor PHP no estuvo listo en 30 segundos." >&2
              cat /tmp/php-server.log
              exit 1
            fi
            sleep 1
          done

          composer tceI -- --env ci

      - name: Guardar evidencias si falla la prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-report
          path: tests/_output/
