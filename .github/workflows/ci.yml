name: Smoke Tests

# Se dispara en cada push o Pull Request hacia las ramas principales
on:
  push:
    branches: [deploy]
  pull_request:
    branches: [deploy]

jobs:
  smoke:
    name: Run Smoke Tests
    runs-on: ubuntu-latest

    # Servicio de base de datos efímero para validar arranque y conectividad
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "root_password"
          MYSQL_DATABASE: proyecto_lacruz
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, json, pdo, pdo_mysql
          tools: composer

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Grant Execute Permissions to Codeception
        run: chmod +x vendor/bin/codecept

      - name: Levantar servidor web integrado de PHP en segundo plano
        run: |
          php -S 127.0.0.1:8000 -t . &
          sleep 2

      - name: Ejecutar pruebas de humo
        # Filtra únicamente los tests marcados con el grupo @smoke
        run: composer tceI

      - name: Guardar evidencias si falla la prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-report
          path: tests/_output/
