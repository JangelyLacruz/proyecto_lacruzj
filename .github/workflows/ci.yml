name: despliegue y pruebas

# Se dispara en cada push hacia la rama de deploy
on:
  push:
    branches: [deploy,main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  despliegue_a_desarrollo:
    runs-on: ubuntu-24.04
    steps:
      - name: Incluir el codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar fechas reales de Git
        run: |
          python3 -c '
          import os, subprocess
          out = subprocess.check_output(["git", "log", "--pretty=format:TIME:%ct", "--name-only"]).decode("utf-8", "ignore")
          ts = None
          seen = set()
          for line in out.splitlines():
              if line.startswith("TIME:"):
                  ts = int(line[5:])
              elif line and line not in seen:
                  seen.add(line)
                  if os.path.exists(line) and not os.path.islink(line):
                      os.utime(line, (ts, ts))
          '

      - name: Despliegue ultrarrapido por SFTP (lftp + llave SSH)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf "Host namecheap\n  HostName %s\n  User %s\n  Port 21098\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking no\n  BatchMode yes\n" "$SSH_HOST" "$SSH_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          lftp -e "
            set sftp:auto-confirm yes;
            set net:timeout 60;
            set net:max-retries 3;
            open -u $SSH_USER,dummy sftp://namecheap;
            mirror -R --delete --parallel=4 --no-perms --verbose \
              --exclude ^\.git/ \
              --exclude ^\.github/ \
              --exclude ^\.gitignore$ \
              ./ dev.jlacruzca.com/;
            bye
          "

